services:
  redis:
    image: redis:7.2.1-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
  tradinggoose:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiujie2}/tradinggoose:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tradinggoose}
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
      - REDIS_URL=redis://redis:6379
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
      - COPILOT_API_URL=${COPILOT_API_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
      - INTERNAL_SOCKET_URL=${INTERNAL_SOCKET_URL:-http://realtime:3002}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-}
      - OPENCODE_USERNAME=${OPENCODE_USERNAME:-}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-}
      - CRON_SECRET=${CRON_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The helm chart drives the scheduled endpoints with Kubernetes CronJobs; a
  # compose deployment had nothing calling them, so scheduled workflows never
  # fired. Same contract: an authenticated request per tick.
  cron:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - APP_URL=${INTERNAL_APP_URL:-http://tradinggoose:3000}
    depends_on:
      tradinggoose:
        condition: service_healthy
    command:
      - /bin/sh
      - -euc
      - |
        if [ -z "$${CRON_SECRET}" ]; then
          echo "CRON_SECRET is empty: set it in .env, or scheduled workflows will not run." >&2
          echo "The app rejects unauthenticated cron calls, so starting without it is pointless." >&2
          exit 1
        fi

        # busybox crond hands jobs a minimal environment, so the secret goes in a
        # file the runner sources. Passing it on the cron command line would put
        # it in `ps` output and in crond's own log lines.
        umask 077
        printf 'CRON_SECRET=%s\nAPP_URL=%s\n' "$${CRON_SECRET}" "$${APP_URL}" > /etc/tg-cron.env

        cat > /usr/local/bin/tg-cron <<'RUNNER'
        #!/bin/sh
        . /etc/tg-cron.env
        if ! wget -q -O /dev/null --timeout=60 \
          --header="Authorization: Bearer $${CRON_SECRET}" \
          --header="User-Agent: tradinggoose-compose-cron" \
          "$${APP_URL}$${1}"; then
          echo "cron $${1} failed (exit $$?)" >&2
        fi
        RUNNER
        chmod +x /usr/local/bin/tg-cron

        mkdir -p /etc/crontabs
        cat > /etc/crontabs/root <<'CRONTAB'
        * * * * * /usr/local/bin/tg-cron /api/schedules/execute
        0 3 * * * /usr/local/bin/tg-cron /api/webhooks/cleanup/idempotency
        CRONTAB

        echo "cron ready: schedules every minute, idempotency cleanup at 03:00"
        exec crond -f -l 8

  realtime:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiujie2}/realtime:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tradinggoose}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3002/health']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrations:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiujie2}/migrations:${IMAGE_TAG:?set IMAGE_TAG in .env}
    working_dir: /app/packages/db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tradinggoose}
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      # Loopback-only by default so a public host does not expose Postgres.
      # Set POSTGRES_BIND_HOST=0.0.0.0 to reach it from another machine.
      - '${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tradinggoose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
